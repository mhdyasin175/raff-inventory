# Builds and tests the API and the web app on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Raff.slnx -c Release
      # The tests start a real SQL Server in Docker (Testcontainers); GitHub runners have Docker built in.
      - run: dotnet test Raff.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: test-results

  web:
    name: Web build + end-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
