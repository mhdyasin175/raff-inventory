<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18201D" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Apply saved language/look before first paint (no flash of the wrong direction or theme).
      try {
        var l = localStorage.getItem('raff.lang') === 'en' ? 'en' : 'ar';
        var th = localStorage.getItem('raff.theme');
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.dataset.theme = th === 'raff' || th === 'adminlte' ? th : 'shadcn';
      } catch (e) { document.documentElement.dataset.theme = 'shadcn'; }
    </script>
    <title>رفّ — إدارة المخزون</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
